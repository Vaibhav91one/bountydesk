name: Build Daytona target image

# Builds the connected demo fork at its pinned commit into the image the Daytona snapshot for
# reproduction boots from, and pushes it digest-pinned to GHCR. Manual and rare on purpose: this
# is an operator action taken once per verified build, not something that runs on every push.
# The commit is hardcoded below rather than accepted as an input, for the same reason the
# sandbox client never accepts one from anywhere but a TargetProfile: nothing here should read
# like a place to plug in an arbitrary ref.
on:
  workflow_dispatch: {}

# Only packages: write. The source clone below is forced anonymous (token: ""), since the fork
# is public and a token that can write packages here has no business being handed to git for a
# checkout of someone else's repository; contents: read on this repository is not needed by
# anything else in this job.
permissions:
  packages: write

env:
  SOURCE_REPO: Vaibhav91one/juice-shop
  SOURCE_COMMIT: 1867b926c5f50e4e692dc9c8f61821413cebe0cd
  IMAGE: ghcr.io/vaibhav91one/juice-shop

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the connected fork at the pinned commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_COMMIT }}
          token: ""
          persist-credentials: false
          path: source

      - name: Confirm the checkout resolved to the exact pinned commit
        run: |
          resolved="$(git -C source rev-parse HEAD)"
          if [ "$resolved" != "$SOURCE_COMMIT" ]; then
            echo "checked out $resolved, expected $SOURCE_COMMIT" >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Plain "docker build", not buildx: both this build and the next one run against the
      # runner's own Docker Engine image store, so the second build's FROM can see this one's
      # output with no cross-driver ambiguity about what is and is not visible between builds.
      # ubuntu-24.04 runners are already linux/amd64, so this is a native build, not a
      # cross-platform one, and needs no buildx/QEMU setup either way.
      #
      # The fork's own final stage is gcr.io/distroless/nodejs20-debian12, which has no shell
      # and no curl. Daytona's toolbox needs to exec arbitrary commands against whatever a
      # sandbox boots from, and every example in Daytona's own docs uses a shell-bearing base,
      # so the deployed sandbox image is built from the fork's "installer" stage instead: the
      # same app, still on node:20-buster, which has both. This is a demo-infrastructure choice
      # about what BountyDesk boots, not a change to the fork's application source, which stays
      # byte-identical to upstream's v17.3.0.
      - name: Build the installer stage (same app, has a shell)
        run: docker build --target installer -t local/juice-shop-installer:pinned source

      - name: Build and push the digest-pinned sandbox image
        id: push
        run: |
          mkdir -p sandbox
          cat > sandbox/Dockerfile <<'EOF'
          FROM local/juice-shop-installer:pinned
          RUN apt-get update \
            && apt-get install -y --no-install-recommends curl \
            && rm -rf /var/lib/apt/lists/*
          CMD ["node", "build/app.js"]
          EOF

          tag="${IMAGE}:v17.3.0-bountydesk-sandbox"
          docker build \
            --label "org.bountydesk.source.repo=${SOURCE_REPO}" \
            --label "org.bountydesk.source.commit=${SOURCE_COMMIT}" \
            --label "org.bountydesk.build.workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -t "$tag" \
            sandbox
          docker push "$tag"

          # docker updates an image's RepoDigests with the pushed manifest digest once the push
          # completes, which is the only place this build learns what it actually published.
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$tag" | sed 's/^.*@//')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Record the digest-pinned reference
        run: |
          digest="${{ steps.push.outputs.digest }}"
          {
            echo "## Daytona target image"
            echo ""
            echo "DAYTONA_TARGET_IMAGE_DIGEST (bare digest, what env.example and target_profile expect):"
            echo '```'
            echo "$digest"
            echo '```'
            echo ""
            echo "Full reference (what a TargetProfile's imageRef compares against a snapshot's imageName):"
            echo '```'
            echo "${IMAGE}@${digest}"
            echo '```'
            echo ""
            echo "Neither is a secret, but neither is committed anywhere either: copy them into .env.local by hand."
          } | tee -a "$GITHUB_STEP_SUMMARY"
