name: Verify PR Agent review

on:
  workflow_run:
    workflows: [PR Agent review]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-agent-verify-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve reviewed pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          numbers="$(gh api "repos/${REPOSITORY}/commits/${HEAD_SHA}/pulls" \
            -H 'Accept: application/vnd.github+json' \
            --jq '[.[] | select(.base.repo.full_name == env.REPOSITORY and .head.sha == env.HEAD_SHA) | .number] | unique | .[]')"
          test -n "$numbers"
          test "$(printf '%s\n' "$numbers" | wc -l | tr -d ' ')" = 1
          printf 'number=%s\n' "$numbers" >> "$GITHUB_OUTPUT"

      - name: Verify current-head publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_AGENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node .github/scripts/verify-pr-agent-review.mjs
