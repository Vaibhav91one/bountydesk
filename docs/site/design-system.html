<script>

const m = (name) => '<img class="mascot" src="assets/mascot/' + name + '.svg" alt="">';
const sw = (...c) => '<div class="sw">' + c.map(x => '<i style="background:' + x + '"></i>').join('') + '</div>';
const big = (c) => '<div class="big" style="background:' + c + '"></div>';
const typeSample = (style, t) => '<p class="tx" style="' + style + '">' + t + '</p>';
const desktopTree = {c:'Design system', n:'Tokens, type, color, mascot\nDark is the default; add ?theme=light to flip', root:true, mid:true, wrap:3, k:[

  ]},

    {c:'Meta', n:'0.8125rem (13), muted\nRow subtitle, pill label, footnote', h:typeSample('font:400 13px Inter,sans-serif;opacity:.7', 'BD-1042')},
    {c:'Mono', n:'Geist Mono, 0.8125 to 0.875rem\nContent hash, ids, commit', h:typeSample('font:400 13px "Geist Mono",monospace', 'sha256:9f2c61ab07d4')},
    {c:'Tab label', n:'0.75rem (12), 500\nThe smallest text in the kit', h:typeSample('font:500 12px Inter,sans-serif;opacity:.7', 'Reports')},
  ]},
  {c:'Radius', n:'Large and round: cards are not squared off', side:1, cls:'plan', k:[

    {c:'Pill and button 26 to 36', n:'Buttons 26, chips 22, tab pill 32\nFloating bar 36, sheet top 36', h:'<div class="big" style="border-radius:36px;background:oklch(0.5 0 0)"></div>'},

  ]},
  {c:'Touch targets', n:'44 pt on iOS, 48 dp on Android', side:1, cls:'status', k:[
    {c:'Met', n:'Icon buttons 48, primary button 52\nRows 56, menu items 54, sheet rows 64\nTab pill 64, Review next 64 by 64\nSheet X and check 52, code boxes 48 by 58'},
    {c:'Platform step', n:'Chips, segmented items and the section more\nbutton are 44 on iOS, 48 on Android'},

  ]},
  {c:'Phase pills', n:'The state of a report, always named', side:1, cls:'plan', k:[
    {c:'Anatomy', n:'Tint of the phase hue at 16 percent\nFull-hue label, 6 px dot, 0.8125rem 600', h:'<span style="display:inline-flex;align-items:center;gap:6px;font:600 13px Inter,sans-serif;padding:6px 11px;border-radius:99px;color:oklch(0.8 0.15 75);background:oklch(0.8 0.15 75 / 16%)"><i style="width:6px;height:6px;border-radius:50%;background:currentColor"></i>Approval</span>'},
    {c:'Labels', n:'Approval, Reproducing, Analysis, Triaging,\nDelivered, Closed\nAwaiting approval on the larger cards'},
  ]},
  {c:'Glass and surfaces', n:'Floating chrome over the scroll area', side:-1, cls:'agent', k:[
    {c:'Glass pill', n:'Blur 24 px, saturate 180 percent, 1 px edge\nTab pill, bell and more pill, back button,\naction pill, floating bar, composer'},
    {c:'Soft edges', n:'A fade over the top and bottom of the scroll\narea keeps rows from cutting under the pills'},
    {c:'Reduced transparency', n:'Glass, menu and sheet drop the blur\nand use the opaque card color'},
    {c:'Never nested', n:'A card never sits in a card\nGroups are separated by whitespace'},
  ]},
  {c:'iOS and Android', n:'Same layout and tokens, two renderings\n?platform=ios (default) | android', side:1, cls:'reporter', k:[
    {c:'iOS', n:'Translucent glass pills, 55 px device radius\nDynamic island, large back button in a round glass\nGrabber on sheets, menu 22 radius\n51 by 31 switch, push slide 350 ms'},
    {c:'Android (Material 3)', n:'.pf-android rules in c.css\nBack is an arrow in a round tonal button\nTab pill becomes a Material 3 floating toolbar: tonal\nsurface, active item a filled pill\nReview next is a 16 dp FAB, sheet 28 radius, 32 by 4 handle\nSnackbar-style toast, menu 12 radius, fade through'},
    {c:'Status bar', n:'iOS 54 px with island\nAndroid 40 px with a punch hole'},
  ]},
  {c:'Mapping to code', n:'How the tokens and parts reach the app', side:-1, cls:'agent', k:[
    {c:'@expo/ui', n:'Host, Column, Row, List and Section,\nButton, Text, Picker, Switch\nSwiftUI on iOS, Compose on Android'},
    {c:'StyleSheet', n:'Tokens, type and radius as plain values\nfor the parts @expo/ui does not cover\nThe theme module shape is not decided'},

const VIEW = new URLSearchParams(location.search).get('view') === 'mobile' ? 'mobile' : 'desktop'; const tree = VIEW === 'mobile' ? mobileTree : desktopTree;
