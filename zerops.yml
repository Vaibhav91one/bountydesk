zerops:
  - setup: bdworker
    build:
      base: nodejs@22
      buildCommands:
        - npm ci
      deployFiles:
        - agent
        - app
        - components
        - design
        - docs
        - drizzle
        - hooks
        - lib
        - public
        - scripts
        - skills
        - drizzle.config.ts
        - eslint.config.mjs
        - next.config.ts
        - node_modules
        - package-lock.json
        - package.json
        - postcss.config.mjs
        - proxy.ts
        - tsconfig.json
      cache:
        - node_modules
    run:
      base: nodejs@22
      envVariables:
        NODE_ENV: production
        TRUEFORGE_URL: http://trueforge:8791
        DATABASE_POOL_MAX: "4"
        WORKER_HEALTH_PORT: "8080"
      start: npm run worker:daemon
      healthCheck:
        httpGet:
          port: 8080
          path: /healthz
        failureTimeout: 60s
        disconnectTimeout: 30s
        recoveryTimeout: 30s
        execPeriod: 30s

  - setup: trueforge
    build:
      base: nodejs@22
      os: ubuntu
      prepareCommands:
        - sudo apt-get update
        - sudo apt-get install -y python3 make g++
      buildCommands:
        - cd ops/trueforge && npm install --omit=dev
      deployFiles:
        - agent
        - ops/trueforge
        - scripts/run-trueforge-proxy.mjs
        - scripts/bootstrap-trueforge.mjs
        - skills
      cache:
        - ops/trueforge/node_modules
    deploy:
      readinessCheck:
        httpGet:
          port: 8791
          path: /healthz
        failureTimeout: 90s
        retryPeriod: 10s
    run:
      base: nodejs@22
      os: ubuntu
      ports:
        - port: 8791
          httpSupport: true
      volume:
        hostname: tfdata
        mountPath: /mnt/tfdata
      envVariables:
        NODE_ENV: production
        TRUEFORGE_UPSTREAM_URL: http://127.0.0.1:8790
        TRUEFORGE_PROXY_PORT: "8791"
        TRUEFORGE_PROXY_HEALTH_URL: http://127.0.0.1:8791/healthz
        SQLITE_PATH: /mnt/tfdata/db.sqlite
        HOST: 127.0.0.1
      startCommands:
        - name: trueforge
          command: node ops/trueforge/node_modules/@truefoundry/trueforge/dist/cli.js --port 8790
        - name: proxy
          command: TRUEFORGE_PROXY_HOSTS="127.0.0.1,$(hostname -i | awk '{print $1}')" node scripts/run-trueforge-proxy.mjs
        - name: bootstrap
          command: node scripts/bootstrap-trueforge.mjs
      healthCheck:
        httpGet:
          port: 8791
          path: /healthz
        failureTimeout: 60s
        disconnectTimeout: 30s
        recoveryTimeout: 30s
        execPeriod: 30s
