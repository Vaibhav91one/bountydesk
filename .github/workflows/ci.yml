name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # The queue's guarantees are Postgres guarantees (FOR UPDATE SKIP LOCKED, unique
    # constraints), so the tests run against a real server rather than a mock that would
    # happily agree with a wrong implementation.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Clerk keys are needed at build time (the provider and proxy throw without a publishable
      # key). These are the development-instance keys; production uses its own.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      REVIEWER_EMAILS: ci@bountydesk.test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Migrate
        run: npm run db:migrate

      # drizzle-kit decides what a migration contains by diffing the committed snapshot
      # against the schema. A hand-written migration with no matching snapshot looks like it
      # never happened, and the next generate writes a second CREATE TABLE for the same
      # table. This fails the build while that is still cheap to fix.
      - name: Check for schema drift
        run: npm run db:drift

      - name: Verify PR Agent policy tests
        run: node --test .github/scripts/pr-agent-policy.test.mjs
      - name: Verify PR Agent verifier tests
        run: node --test .github/scripts/verify-pr-agent-review.test.mjs
      - name: Test
        run: npm run test --if-present
      - name: Build
        run: npm run build
