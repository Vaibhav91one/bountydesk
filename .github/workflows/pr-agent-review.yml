name: PR Agent review

# pull_request_target runs this workflow from the base branch, so a PR cannot
# change its own review policy. There is no checkout step on purpose: the
# action reads the PR through the API only and never executes PR code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Run advisory review
        uses: The-PR-Agent/pr-agent@f3b385ea2927247ddcff2fe252472380b9c8f5fc # v0.45.0
        env:
          OPENAI_KEY: ${{ secrets.PR_AGENT_OPENAI_KEY }}
          # No OPENAI.API_BASE override: default api.openai.com used.
          # Vyce DeepSeek v4.1 proven unable to hold structured output (6 live parse failures).
          config.repo_context_files: '["AGENTS.md"]'
          config.repo_context_from_default_branch: 'true'
          config.repo_context_max_lines: '500'
          config.model: gpt-4o-mini
          config.fallback_models: '[]'
          config.custom_model_max_tokens: '32000'
          config.propagate_tool_errors: 'true'
          config.duplicate_prompt_examples: 'true'
          config.temperature: '0'
          config.publish_output: 'true'
          config.enable_auto_approval: 'false'
          pr_reviewer.persistent_comment: 'false'
          # Keep state reconciliation off until provider output is proven stable.
          # A malformed model response must not block the canonical comment path.
          pr_reviewer.persistent_finding_state: 'false'
          pr_reviewer.review_heading: 'Code Review'
          pr_reviewer.final_update_message: 'true'
          pr_reviewer.publish_output_no_suggestions: 'true'
          pr_reviewer.num_max_findings: '10'
          # Avoid bracketed YAML field name rejected by current provider.
          pr_reviewer.require_estimate_effort_to_review: 'false'
          pr_reviewer.extra_instructions: >-
            Return only valid YAML. Preserve exact indentation from the example: nested keys under review use two spaces, block scalar values are indented four spaces, list item keys are indented six spaces. Never place a scalar at the same indentation as its key. Never use markdown tables in review output. Use bullet lists only. Post inline review comments on every file touched, even when no code suggestions exist: flag formatting, naming, and style issues inline. If a file is clean, post a single inline comment saying Looks good on the last changed line. Do not produce a summary section; findings live only as inline comments. Professional tone: use direct language, avoid filler and decorative punctuation, lead each comment with a short severity tag (info / nit / low / medium / high) followed by a colon and a concise statement. Each comment is one or two sentences. No emoji. Section headings in sentence case only. Match Qodo style: each inline comment opens with the severity tag and a brief label on its own line, then a blank line, then the finding in one short paragraph.
          pr_reviewer.require_tests_review: 'false'
          pr_reviewer.require_security_review: 'false'
          pr_reviewer.require_ticket_analysis_review: 'false'
          pr_reviewer.enable_help_text: 'false'
          pr_reviewer.enable_relevant_theory: 'true'
          pr_reviewer.suggestion_preference: 'diff'
          pr_description.enable_pr_description: 'false'
          pr_description.enable_pr_diagram: 'true'
          # Diagram-only describe: no summary, type, or walkthrough sections.
          pr_description.enable_pr_type: 'false'
          pr_description.enable_semantic_files_types: 'false'
          pr_description.extra_instructions: 'Never use markdown tables in output. Use bullet lists instead.'
          pr_code_suggestions.commitable_code_suggestions: 'true'
          pr_code_suggestions.extra_instructions: 'Never use markdown tables in output. Use bullet lists instead.'
          pr_questions.enable_help_text: 'false'
          pr_code_suggestions.enable_help_text: 'false'
          pr_help_docs.enable_help_text: 'false'
          github.publish_as_check_run: 'false'
          skills.enabled: 'false'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          github_action_config.pr_actions: '["opened", "reopened"]'
          github_action_config.auto_review: 'true'
          github_action_config.auto_describe: 'true'
          github_action_config.auto_improve: 'true'
          github_action_config.handle_push_trigger: 'true'
          github_action_config.push_commands: '["/review", "/describe", "/improve"]'
