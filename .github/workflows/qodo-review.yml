name: Qodo review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: qodo-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qodo-reviewed:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BOT_LOGIN: qodo-code-review[bot]
      # How long to wait for Qodo to catch up with a fresh push, in seconds.
      WAIT_SECONDS: 600
    steps:
      - name: Require Qodo review of current head
        shell: bash
        run: |
          set -euo pipefail

          # Qodo signals the revision it reviewed in three different ways:
          #   1. On the first pass it submits a formal review whose commit_id is the
          #      reviewed SHA.
          #   2. On a later push with real diff content, it edits that same comment
          #      in place instead of submitting another review, so commit_id goes
          #      stale. The refreshed body links the revision it actually covers as
          #      ".../commit/<sha>".
          #   3. On a push whose tree is identical to what it already reviewed (a
          #      merge or rebase that pulls in already-reviewed upstream content
          #      with no net diff of its own, for instance), it posts "No code
          #      changes since the last review — review skipped" instead of a
          #      commit-linked body, since there is nothing new to comment on.
          # Accept any of the three, or a PR is unmergeable after a no-op push.

          reviewed_head() {
            local reviews comments head_pushed_at

            reviews="$(gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")"
            if jq -e --arg bot "$BOT_LOGIN" --arg sha "$HEAD_SHA" '
              any(.[][];
                .user.login == $bot and
                .commit_id == $sha and
                .state != "DISMISSED"
              )
            ' <<<"$reviews" >/dev/null; then
              echo "Found a Qodo review submitted against ${HEAD_SHA}."
              return 0
            fi

            comments="$(gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100")"
            if jq -e --arg bot "$BOT_LOGIN" --arg sha "$HEAD_SHA" '
              any(.[][];
                .user.login == $bot and
                (.body | contains("commit/" + $sha))
              )
            ' <<<"$comments" >/dev/null; then
              echo "Found a Qodo review comment covering ${HEAD_SHA}."
              return 0
            fi

            # A "review skipped, no code changes" reply carries no commit reference
            # to match against, so correlate it by time instead: it only counts if
            # it was posted at or after HEAD_SHA's own commit timestamp, meaning
            # Qodo looked at (or would have looked at) this exact tree and found
            # nothing new relative to what it already reviewed.
            head_pushed_at="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}" \
              --jq '.commit.committer.date')"
            if jq -e --arg bot "$BOT_LOGIN" --arg since "$head_pushed_at" '
              any(.[][];
                .user.login == $bot and
                (.body | test("no code changes since the last review"; "i")) and
                .updated_at >= $since
              )
            ' <<<"$comments" >/dev/null; then
              echo "Qodo reported no code changes since its last review, at or after ${HEAD_SHA}'s own commit time."
              return 0
            fi

            return 1
          }

          # Qodo needs a minute or two after a push, so poll rather than failing on
          # the first miss. Without this the check goes red purely on timing and
          # someone has to re-run it by hand.
          deadline=$(( SECONDS + WAIT_SECONDS ))
          until reviewed_head; do
            if (( SECONDS >= deadline )); then
              echo "::error::Qodo has not reviewed ${HEAD_SHA} after ${WAIT_SECONDS}s. Comment '/agentic_review' on the PR, then re-run this check."
              exit 1
            fi
            echo "Waiting for Qodo to review ${HEAD_SHA}..."
            sleep 20
          done
