<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>BountyDesk demo tour</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/vendor/recording-components.min.js"></script>
    <style>
      @font-face {
        font-family: "Questrial";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("assets/fonts/questrial-latin.woff2") format("woff2");
      }

      @font-face {
        font-family: "Roboto Mono";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("assets/fonts/robotomono-latin.woff2") format("woff2");
      }

      :root {
        --bg-page: #07080d;
        --panel: #11131d;
        --panel-2: #181b28;
        --panel-light: #f3f0ea;
        --ink: #f7f4ec;
        --ink-muted: #aaa6b8;
        --ink-dark: #15131f;
        --border: rgba(255, 255, 255, 0.12);
        --accent: #8478ff;
        --accent-2: #3ee6ad;
        --warning: #f4c15d;
        --font-sans: "Questrial", ui-sans-serif, system-ui, sans-serif;
        --font-mono: "Roboto Mono", monospace;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg-page);
      }

      body {
        font-family: var(--font-sans);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      .scene {
        overflow: hidden;
      }

      .recording-bg {
        position: absolute;
        inset: 0;
        z-index: 10;
        overflow: hidden;
        background: var(--bg-page);
      }

      .recording-bg::before {
        content: "";
        position: absolute;
        inset: -120px;
        display: none;
        opacity: 0.34;
        background:
          linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
        background-size: 92px 92px;
        mask-image: radial-gradient(circle at 50% 50%, black, transparent 72%);
      }

      .recording-bg::after {
        content: "";
        position: absolute;
        inset: 0;
        display: none;
        opacity: 0.12;
        background-image:
          repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.12) 0 1px, transparent 1px 3px);
      }

      .tour-card {
        position: absolute;
        left: 240px;
        top: 60px;
        width: 1440px;
        height: 900px;
        overflow: hidden;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 34px 70px rgba(0, 0, 0, 0.48);
        z-index: 11;
        background: var(--panel);
      }

      .tour-card.portrait {
        left: 736px;
        top: 55px;
        width: 448px;
        height: 970px;
        border-radius: 34px;
        opacity: 0;
      }

      #tour-card {
        background: transparent;
        border-color: transparent;
        box-shadow: none;
      }

      .bd-shot {
        position: absolute;
        inset: 0;
        opacity: 0;
      }

      .bd-chrome {
        width: 1440px;
        height: 900px;
        position: relative;
        color: var(--ink-dark);
        background:
          radial-gradient(circle at 82% 20%, rgba(132, 120, 255, 0.13), transparent 26%),
          linear-gradient(135deg, #faf8f2, #f0ece3);
      }

      .bd-chrome.dark {
        color: var(--ink-dark);
      }

      .bd-chrome.light {
        color: var(--ink-dark);
        background:
          radial-gradient(circle at 82% 18%, rgba(132, 120, 255, 0.2), transparent 25%),
          linear-gradient(135deg, #f7f3ed, #ebe6dc);
      }

      .bd-chrome.score {
        display: grid;
        place-items: center;
        background: #f7f8f3;
      }

      .bd-chrome.bare {
        display: grid;
        place-items: center;
        color: var(--ink);
        background: var(--bg-page);
      }

      .bd-chrome.intro {
        display: grid;
        place-items: center;
        color: var(--ink);
        background: var(--bg-page);
      }

      .bd-chrome.portrait {
        width: 448px;
        height: 970px;
        overflow: hidden;
        color: var(--ink-dark);
        background: #f7f5ef;
      }

      .topbar {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 188px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 14px;
        padding: 22px 18px;
        border-right: 1px solid rgba(255, 255, 255, 0.1);
        border-bottom: 0;
        background: #0c0d12;
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--ink-muted);
      }

      .light .topbar {
        border-bottom-color: rgba(21, 19, 31, 0.12);
        color: #655f70;
      }

      .traffic {
        display: flex;
        gap: 9px;
        margin-bottom: 18px;
      }

      .traffic span {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.25);
      }

      .url {
        height: 38px;
        display: flex;
        align-items: center;
        padding: 0 12px;
        border-radius: 8px;
        background: rgba(132, 120, 255, 0.18);
        color: var(--ink);
      }

      .light .url {
        background: rgba(21, 19, 31, 0.06);
      }

      .brand-pill,
      .status {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 8px 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: var(--ink);
      }

      .brand-pill {
        gap: 8px;
        margin-bottom: 20px;
        background: rgba(255, 255, 255, 0.07);
      }

      .brand-pill img {
        width: 18px;
        height: 18px;
        display: block;
      }

      .nav-item {
        height: 34px;
        display: flex;
        align-items: center;
        padding: 0 12px;
        border-radius: 8px;
        color: #8c8998;
      }

      .nav-item.active {
        color: #f7f4ec;
        background: rgba(255, 255, 255, 0.08);
      }

      .status {
        font-family: var(--font-mono);
        font-size: 11px;
        text-transform: uppercase;
      }

      .status.violet { background: rgba(132, 120, 255, 0.18); color: #3f35a5; }
      .status.green,
      .status.ok { background: rgba(62, 230, 173, 0.16); color: #136446; }
      .status.amber { background: rgba(244, 193, 93, 0.2); color: #765817; }
      .status.muted { background: rgba(21, 19, 31, 0.06); color: #56515f; }
      .light .status.green { color: #136446; border-color: rgba(19, 100, 70, 0.24); }

      h1,
      h2,
      h3,
      p {
        font-weight: 400;
        letter-spacing: 0;
      }

      h1 {
        font-size: 78px;
        line-height: 0.92;
        max-width: 860px;
      }

      h2 {
        font-size: 63px;
        line-height: 0.94;
        max-width: 660px;
      }

      h3 {
        font-size: 30px;
        line-height: 1.02;
      }

      p {
        margin-top: 28px;
        font-size: 25px;
        line-height: 1.34;
        color: #6e6878;
        max-width: 720px;
      }

      .light p {
        color: #5d5969;
      }

      .eyebrow {
        margin-bottom: 18px;
        font-family: var(--font-mono);
        font-size: 15px;
        color: #5c51dd;
        text-transform: uppercase;
      }

      .hero-shot,
      .two-col,
      .verdict-panel,
      .run-log,
      .trace,
      .queue-shot,
      .scope,
      .similar,
      .approval,
      .delivery,
      .compare {
        height: calc(100% - 68px);
        height: 100%;
        padding: 74px 74px 74px 258px;
        display: grid;
        grid-template-columns: 1.08fr 0.92fr;
        align-items: center;
        gap: 70px;
      }

      .mascot-ring {
        width: 360px;
        height: 360px;
        justify-self: center;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: #0c0d12;
        border: 1px solid rgba(132, 120, 255, 0.34);
        box-shadow: inset 0 0 80px rgba(132, 120, 255, 0.18), 0 0 80px rgba(132, 120, 255, 0.12);
      }

      .mascot-ring img {
        width: 225px;
        height: 225px;
      }

      .problem-shot {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        padding: 96px 112px;
        text-align: center;
      }

      .problem-shot h1 {
        max-width: 1040px;
        margin: 0 auto;
        font-size: 76px;
        line-height: 0.98;
      }

      .brand-intro-shot {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 28px;
        padding: 96px 112px;
        text-align: center;
      }

      .brand-intro-shot h2 {
        max-width: 980px;
        font-size: 58px;
        line-height: 1;
        color: rgba(247, 244, 236, 0.72);
      }

      .brand-intro-lockup {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 32px;
      }

      .brand-intro-logo {
        width: 112px;
        height: 112px;
        display: block;
        opacity: 0;
        will-change: transform, opacity;
      }

      .brand-intro-shot h1 {
        max-width: 1120px;
        margin: 0 auto;
        font-size: 92px;
        line-height: 0.96;
      }

      .text-animate {
        display: inline;
      }

      .text-animate-token {
        display: inline-block;
        opacity: 0;
        will-change: transform, opacity;
      }

      .landing-hero-showcase,
      .section-showcase,
      .agent-showcase {
        height: 100%;
        padding: 76px 76px 76px 258px;
        display: grid;
        grid-template-columns: 0.92fr 1.08fr;
        align-items: center;
        gap: 58px;
      }

      .landing-hero-showcase {
        grid-template-columns: 1fr;
        align-content: start;
        padding: 48px 92px 72px 258px;
        text-align: center;
      }

      .site-header-mini {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 22px;
        color: #6e6878;
        font-family: var(--font-mono);
        font-size: 14px;
      }

      .site-header-mini img {
        width: 28px;
        height: 28px;
      }

      .landing-copy {
        display: grid;
        justify-items: center;
        gap: 28px;
      }

      .landing-copy h1 {
        max-width: 1040px;
        color: var(--ink-dark);
        font-size: 76px;
        line-height: 0.98;
      }

      .landing-copy h1 span {
        display: block;
      }

      .landing-copy p {
        margin: 0;
        max-width: 780px;
        color: #6e6878;
      }

      .hero-actions {
        display: flex;
        justify-content: center;
        gap: 14px;
      }

      .hero-panel {
        justify-self: center;
        width: 780px;
      }

      .approval-card,
      .channel-card,
      .queue-column,
      .reports-table,
      .faq-list {
        border-radius: 16px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 26px 70px rgba(0, 0, 0, 0.26);
      }

      .approval-card {
        padding: 28px;
        display: grid;
        gap: 18px;
        color: var(--ink-dark);
      }

      .approval-card.compact {
        padding: 22px;
        gap: 14px;
        text-align: left;
        background: rgba(247, 244, 236, 0.96);
      }

      .approval-top,
      .approval-meta,
      .approval-actions,
      .filter-row,
      .table-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }

      .approval-top > span:last-child {
        min-width: 0;
        flex: 1;
        font-size: 22px;
        text-align: right;
      }

      .agent-reply {
        display: grid;
        grid-template-columns: 64px 1fr;
        gap: 18px;
        padding: 22px;
        border-radius: 12px;
        border: 1px solid rgba(21, 19, 31, 0.12);
        background: #f7f4ec;
      }

      .agent-reply img {
        width: 64px;
        height: 64px;
      }

      .agent-reply span,
      .approval-meta span,
      .approval-meta strong,
      .channel-card span,
      .queue-card span,
      .queue-card small,
      .search-row,
      .filter-row,
      .table-row small {
        font-family: var(--font-mono);
      }

      .agent-reply p {
        margin: 8px 0 0;
        color: #403b49;
        font-size: 20px;
        line-height: 1.36;
      }

      .agent-reply strong {
        font-weight: 400;
      }

      .approval-meta {
        padding-top: 4px;
        color: #655f70;
        font-size: 14px;
      }

      .approval-meta strong {
        min-width: 0;
        color: var(--ink-dark);
        font-weight: 400;
        overflow-wrap: anywhere;
      }

      .approval-actions {
        justify-content: flex-end;
        padding-top: 6px;
      }

      .channels-showcase,
      .queue-landing-showcase,
      .reports-showcase,
      .faq-showcase {
        grid-template-columns: 0.82fr 1.18fr;
      }

      .section-showcase h2,
      .agent-showcase h2 {
        max-width: 760px;
      }

      .section-showcase p,
      .agent-showcase p {
        max-width: 620px;
      }

      .channel-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
      }

      .channel-card {
        min-height: 214px;
        padding: 24px;
        display: grid;
        align-content: space-between;
        gap: 18px;
      }

      .channel-card > div {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .channel-icon {
        width: 50px;
        height: 50px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        color: var(--ink);
        background: #0c0d12;
        font-size: 22px;
      }

      .channel-card strong {
        font-size: 32px;
        font-weight: 400;
      }

      .channel-card span {
        color: #6e6878;
        font-size: 15px;
        line-height: 1.35;
      }

      .agent-showcase {
        grid-template-columns: 1.05fr 0.95fr;
      }

      .mascot-row {
        height: 340px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        overflow: hidden;
        border-radius: 18px;
        border: 1px solid var(--border);
        background: #0c0d12;
        box-shadow: inset 0 0 80px rgba(132, 120, 255, 0.12), 0 28px 70px rgba(0, 0, 0, 0.26);
      }

      .mascot-row img {
        width: 74px;
        height: 74px;
        flex: 0 0 auto;
      }

      .sandbox-board {
        position: relative;
        height: 560px;
        border-radius: 18px;
        border: 1px solid var(--border);
        background:
          linear-gradient(rgba(21, 19, 31, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(21, 19, 31, 0.08) 1px, transparent 1px),
          rgba(255, 255, 255, 0.68);
        background-size: 40px 40px;
        overflow: hidden;
      }

      .sandbox-node {
        position: absolute;
        width: 220px;
        min-height: 84px;
        padding: 18px;
        display: grid;
        align-content: center;
        gap: 8px;
        border-radius: 14px;
        border: 1px solid rgba(21, 19, 31, 0.12);
        background: #fbf7f0;
        box-shadow: 0 18px 42px rgba(55, 45, 31, 0.14);
      }

      .sandbox-node span {
        font-family: var(--font-mono);
        color: #5c51dd;
        font-size: 13px;
      }

      .sandbox-node strong {
        font-size: 22px;
        font-weight: 400;
      }

      .sandbox-node.n1 { left: 52px; top: 54px; }
      .sandbox-node.n2 { right: 62px; top: 54px; }
      .sandbox-node.n3 { left: 52px; top: 238px; }
      .sandbox-node.n4 { right: 62px; top: 238px; }
      .sandbox-node.n5 { left: 52px; bottom: 54px; }
      .sandbox-node.n6 { right: 62px; bottom: 54px; }

      .flow-line {
        position: absolute;
        height: 2px;
        background: linear-gradient(90deg, rgba(132, 120, 255, 0), rgba(132, 120, 255, 0.82));
        transform-origin: 0 50%;
      }

      .flow-line.l1 { left: 272px; top: 96px; width: 250px; }
      .flow-line.l2 { left: 272px; top: 280px; width: 250px; }
      .flow-line.l3 { left: 272px; top: 464px; width: 250px; }
      .flow-line.l4 { right: 172px; top: 144px; width: 2px; height: 205px; }

      .queue-columns {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }

      .queue-column {
        padding: 18px;
        display: grid;
        align-content: start;
        gap: 14px;
      }

      .queue-column header {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--ink-dark);
      }

      .queue-column header span {
        flex: 1;
        font-size: 20px;
      }

      .queue-column header small {
        font-family: var(--font-mono);
        color: #6e6878;
      }

      .phase-dot {
        width: 11px;
        height: 11px;
        flex: 0 0 auto;
        border-radius: 999px;
        background: var(--accent);
      }

      .phase-dot.phase-reproducing { background: #3ee6ad; }
      .phase-dot.phase-approval { background: #f4c15d; }
      .phase-dot.phase-delivered { background: #48d18c; }

      .queue-card {
        min-height: 142px;
        padding: 18px;
        display: grid;
        align-content: space-between;
        gap: 14px;
        border-radius: 12px;
        border: 1px solid rgba(21, 19, 31, 0.1);
        background: #fbf7f0;
      }

      .queue-card.ghost {
        opacity: 0.62;
      }

      .queue-card strong {
        font-size: 20px;
        font-weight: 400;
        line-height: 1.18;
      }

      .queue-card span,
      .queue-card small {
        color: #6e6878;
        font-size: 13px;
      }

      .reports-table {
        padding: 22px;
        display: grid;
        gap: 12px;
      }

      .search-row,
      .filter-row span,
      .table-row {
        border-radius: 10px;
        border: 1px solid rgba(21, 19, 31, 0.1);
        background: #fbf7f0;
      }

      .search-row {
        padding: 14px 18px;
        color: #6e6878;
      }

      .filter-row {
        justify-content: flex-start;
      }

      .filter-row span {
        padding: 9px 13px;
        color: #403b49;
        font-size: 13px;
      }

      .table-row {
        padding: 15px 16px;
        display: grid;
        grid-template-columns: 1.25fr 0.78fr 168px;
      }

      .table-row > span:first-child {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 17px;
      }

      .table-row small {
        align-self: center;
        color: #6e6878;
      }

      .table-row .status {
        justify-self: end;
        white-space: nowrap;
      }

      .faq-list {
        padding: 10px 28px;
      }

      .faq-item {
        padding: 22px 0;
        border-bottom: 1px solid rgba(21, 19, 31, 0.1);
      }

      .faq-item:last-child {
        border-bottom: 0;
      }

      .faq-item strong {
        font-size: 27px;
        font-weight: 400;
      }

      .faq-item p {
        margin-top: 12px;
        color: #6e6878;
        font-size: 20px;
      }

      .faq-item:not(.open) p {
        display: none;
      }

      .footer-close {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        color: rgba(247, 244, 236, 0.36);
        font-size: 170px;
        line-height: 0.9;
        overflow: hidden;
      }

      .footer-close > img:first-child {
        position: absolute;
        top: 228px;
        width: 82px;
        height: 82px;
        opacity: 0.92;
      }

      .footer-close .mascot {
        width: 136px;
        height: 136px;
        opacity: 0.34;
      }

      .footer-close p {
        position: absolute;
        left: 50%;
        bottom: 248px;
        margin: 0;
        transform: translateX(-50%);
        width: 720px;
        color: var(--ink-muted);
        text-align: center;
      }

      .tour-card {
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        border-radius: 0;
      }

      .bd-chrome,
      .bd-chrome.bare,
      .bd-chrome.intro {
        width: 1920px;
        height: 1080px;
      }

      .landing-viewport {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg-page);
      }

      .landing-scroll-content {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1540px;
        will-change: transform;
      }

      .landing-hero {
        position: relative;
        min-height: 790px;
        padding: 46px 320px 0;
        overflow: hidden;
        text-align: center;
        background: #07080d;
      }

      .landing-site-header {
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 22px;
        color: #c9c6d2;
        font-family: var(--font-sans);
        font-size: 13px;
      }

      .landing-logo-lockup {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }

      .landing-logo-lockup img {
        width: 18px;
        height: 18px;
      }

      .landing-site-header nav {
