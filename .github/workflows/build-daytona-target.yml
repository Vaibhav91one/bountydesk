name: Build Daytona target image

# Builds the connected demo fork at its pinned commit into the image the Daytona snapshot for
# reproduction boots from, and pushes it digest-pinned to GHCR. Manual and rare on purpose: this
# is an operator action taken once per verified build, not something that runs on every push.
# The commit is hardcoded below rather than accepted as an input, for the same reason the
# sandbox client never accepts one from anywhere but a TargetProfile: nothing here should read
# like a place to plug in an arbitrary ref.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  SOURCE_REPO: Vaibhav91one/juice-shop
  SOURCE_COMMIT: 1867b926c5f50e4e692dc9c8f61821413cebe0cd
  IMAGE: ghcr.io/vaibhav91one/juice-shop

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the connected fork at the pinned commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
          path: source

      - name: Confirm the checkout resolved to the exact pinned commit
        run: |
          resolved="$(git -C source rev-parse HEAD)"
          if [ "$resolved" != "$SOURCE_COMMIT" ]; then
            echo "checked out $resolved, expected $SOURCE_COMMIT" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The fork's own final stage is gcr.io/distroless/nodejs20-debian12, which has no shell
      # and no curl. Daytona's toolbox needs to exec arbitrary commands against whatever a
      # sandbox boots from, and every example in Daytona's own docs uses a shell-bearing base,
      # so the deployed sandbox image is built from the fork's "installer" stage instead: the
      # same app, still on node:20-buster, which has both. This is a demo-infrastructure choice
      # about what BountyDesk boots, not a change to the fork's application source, which stays
      # byte-identical to upstream's v17.3.0.
      - name: Build the installer stage (same app, has a shell)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: source
          platforms: linux/amd64
          target: installer
          tags: local/juice-shop-installer:pinned
          load: true

      - name: Add curl for the toolbox and the in-sandbox PoC
        run: |
          mkdir -p sandbox
          cat > sandbox/Dockerfile <<'EOF'
          FROM local/juice-shop-installer:pinned
          RUN apt-get update \
            && apt-get install -y --no-install-recommends curl \
            && rm -rf /var/lib/apt/lists/*
          CMD ["node", "build/app.js"]
          EOF

      - name: Build and push the digest-pinned sandbox image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: sandbox
          file: sandbox/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:v17.3.0-bountydesk-sandbox
          labels: |
            org.bountydesk.source.repo=${{ env.SOURCE_REPO }}
            org.bountydesk.source.commit=${{ env.SOURCE_COMMIT }}
            org.bountydesk.build.workflow_run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Record the digest-pinned reference
        run: |
          echo "## Daytona target image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE}@${{ steps.push.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This is DAYTONA_TARGET_IMAGE_DIGEST / the imageRef a TargetProfile pins against. It is not a secret, but it is not committed anywhere either: paste it into .env.local by hand." >> "$GITHUB_STEP_SUMMARY"
