<!doctype html>
<html lang="en">
<head>

<style>.m2-wrap{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;padding:calc(var(--top) + 8px) 20px calc(var(--dockb) + 18px)}

.m2-hero p{font-size:1.0625rem;line-height:1.4;color:var(--muted);max-width:21rem;letter-spacing:0}
.m2-btns{display:grid;gap:12px}
.m2-btns .btn{width:100%}
.m2-legal{padding:18px 8px 0;text-align:center;font-size:.8125rem;line-height:1.5;color:var(--muted);letter-spacing:0}
.m2-legal a{text-decoration:underline}
