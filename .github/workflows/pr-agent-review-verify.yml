name: Verify PR Agent review

on:
  workflow_run:
    workflows: [PR Agent review]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-verify-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve reviewed pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}" \
            --jq '.pull_requests[0].number // empty' > pr-number
          test -s pr-number
          printf 'number=%s\n' "$(cat pr-number)" >> "$GITHUB_OUTPUT"

      - name: Verify current-head publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_AGENT_RUN_ID: ${{ github.event.workflow_run.id }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: node .github/scripts/verify-pr-agent-review.mjs
