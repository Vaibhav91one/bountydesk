[config]
repo_context_files = ["AGENTS.md"]
repo_context_from_default_branch = true
repo_context_max_lines = 500
model = "openai/gpt-5.6-luna"
fallback_models = []
custom_model_max_tokens = 32000
propagate_tool_errors = true
duplicate_prompt_examples = true
temperature = 0
publish_output = true
enable_auto_approval = false

[pr_reviewer]
persistent_comment = true
persistent_finding_state = false
review_heading = "PR Reviewer Guide"
final_update_message = true
publish_output_no_suggestions = true
num_max_findings = 3
# Bracketed field name triggered malformed YAML from the configured provider.
require_estimate_effort_to_review = false
extra_instructions = "Return only valid YAML. Preserve exact indentation from the example: nested keys under review use two spaces, block scalar values are indented four spaces, list item keys are indented six spaces. Never place a scalar at the same indentation as its key."
require_tests_review = false
require_security_review = false
require_ticket_analysis_review = false
enable_help_text = false

[pr_description]
enable_pr_description = false
enable_pr_diagram = false
enable_help_text = false

[pr_questions]
enable_help_text = false

[pr_code_suggestions]
enable_help_text = false

[pr_help_docs]
enable_help_text = false

[github]
publish_as_check_run = false

[skills]
enabled = false
